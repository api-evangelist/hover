openapi: 3.2.0
info:
  title: hover-api-v3 OAuth API
  version: '3'
servers:
- url: https://hover.to
security:
- sec0: []
tags:
- name: OAuth
paths:
  /oauth/authorize:
    get:
      summary: Get Authorization Code
      description: Use this endpoint to generate an Authentication code which will be used in the Access Token generation step
      operationId: get-authorization-code
      parameters:
      - name: response_type
        in: query
        description: Required. Value is always `code`.
        schema:
          type: string
          default: code
      - name: client_id
        in: query
        description: Required. The Client ID value of your integration.
        schema:
          type: string
          default: 42415edf27b07edbb06355ef4f309aa4960893c31
      - name: redirect_uri
        in: query
        description: Required. The URL where the OAuth service redirects after authorization.
        schema:
          type: string
          default: https://hover.to/
      tags:
      - OAuth
  /oauth/token:
    post:
      summary: Generate Access Token
      description: ''
      operationId: generate-access-token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  description: Required. To obtain a new access token, the required value is `authorization_code`
                  default: authorization_code
                client_id:
                  type: string
                  description: Required. The Client ID of your integration
                  default: asdf1c546a2d48e41h2
                client_secret:
                  type: string
                  description: Required. The Client Secret of your integration.
                  default: 8w4e2224s3s5d4f3s
                redirect_uri:
                  type: string
                  description: Required. The Redirect URI of your integration.
                  default: https://hover.to
                code:
                  type: string
                  description: The authorization code obtained in the `Get Authorization Code` process.
                  default: asdfasd1mskdhj44545
          multipart/form-data:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  description: Required. To obtain a new access token, the required value is `authorization_code`
                  default: authorization_code
                client_id:
                  type: string
                  description: Required. The Client ID of your integration
                  default: asdf1c546a2d48e41h2
                client_secret:
                  type: string
                  description: Required. The Client Secret of your integration.
                  default: 8w4e2224s3s5d4f3s
                redirect_uri:
                  type: string
                  description: Required. The Redirect URI of your integration.
                  default: https://hover.to
                code:
                  type: string
                  description: The authorization code obtained in the `Get Authorization Code` process.
                  default: asdfasd1mskdhj44545
      deprecated: false
      security:
      - sec0: []
      tags:
      - OAuth
  /oauth/token/:
    post:
      summary: Refresh Access Token
      description: ''
      operationId: refresh-access-token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  description: Set to `refresh_token` to obtain a new access/refresh token pair.
                  default: refresh_token
                client_id:
                  type: string
                  description: Required. The Client ID of your integration
                  default: asdf1c546a2d48e41h2
                client_secret:
                  type: string
                  description: Required. The Client Secret of your integration.
                  default: 8w4e2224s3s5d4f3s
                refresh_token:
                  type: string
                  description: Your existing refresh_token.
                  default: 8w4e2224s3s5d4f3s
          multipart/form-data:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  description: Set to `refresh_token` to obtain a new access/refresh token pair.
                  default: refresh_token
                client_id:
                  type: string
                  description: Required. The Client ID of your integration
                  default: asdf1c546a2d48e41h2
                client_secret:
                  type: string
                  description: Required. The Client Secret of your integration.
                  default: 8w4e2224s3s5d4f3s
                refresh_token:
                  type: string
                  description: Your existing refresh_token.
                  default: 8w4e2224s3s5d4f3s
      deprecated: false
      tags:
      - OAuth
components:
  securitySchemes:
    sec0:
      type: oauth2
      flows: {}
