openapi: 3.2.0
info:
  title: hover-api-v3 Users API
  version: '3'
servers:
- url: https://hover.to
security:
- sec0: []
tags:
- name: Users
paths:
  /api/v2/users:
    get:
      summary: List Users
      description: ''
      operationId: list-users
      parameters:
      - name: search
        in: query
        description: String. Filter users by search text. You can search by user name or email.
        schema:
          type: string
          default: homeowner@gmail.com
      - name: admin
        in: query
        description: Defaults to neither option. If you pass true admins will be returned. If you pass false no admins will be returned. Leaving blank returns all users
        schema:
          type: boolean
          default: false
      - name: org_id
        in: query
        description: All users that your ACL has access to will be returned. If you specify an `org_id`, only users in that org will be returned
        schema:
          type: integer
          format: int32
          default: 8675309
      - name: state
        in: query
        description: String or Array. If you pass `invited`, users that have been invited, but not activated will be returned. If you pass `activated` users that are activated(members) will be returned. You can also pass an array of states an users matching any of those states will be returned.
        schema:
          type: string
          default: invited
      - name: jobs_need_approval
        in: query
        description: Boolean. If you pass `true', users that require job approval will be returned. If you pass `false` users that do not require job approval will be returned.
        schema:
          type: boolean
          default: false
      - name: sort_order
        in: query
        description: Default sort is based on the `updated_at` column. Availble values are `ASC` and `DESC`, which will cause user objects to be sorted by their first name ascending or descending.
        schema:
          type: string
          default: ASC
      - name: page
        in: query
        description: Integer. Defaults to 1 and returns a specific page of results
        schema:
          type: integer
          format: int32
          default: 1
      - name: per_page
        in: query
        description: Integer. Defaults to 25 and and returns the desired number of user objects on a given page.
        schema:
          type: integer
          format: int32
          default: 25
      deprecated: false
      tags:
      - Users
  /api/v2/users/profile:
    get:
      summary: Show User Profile
      description: ''
      operationId: show-user-profile
      parameters:
      - name: current_user_id
        in: query
        description: Required. The ID of the user whose profile will be returned
        schema:
          type: integer
          format: int32
          default: 8675309
      deprecated: false
      tags:
      - Users
components:
  securitySchemes:
    sec0:
      type: oauth2
      flows: {}
