paths:
  /api/v1/blueprints (COPY):
    post:
      summary: Blueprint Upload - Specify Details
      description: ''
      operationId: blueprint-upload-specify-details
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                current_user_id:
                  type: integer
                  description: Required. The ID value of an admin user in the authenticated Hover organization
                  default: 8675309
                  format: int32
                job:
                  properties:
                    name:
                      type: string
                      description: Required. The name of the job.
                      default: Bluth House
                    deliverable_id:
                      type: integer
                      description: Required. The ID value of the desired deliverable, type 2, 3, or 8.
                      default: 3
                      format: int32
                    file_attachments_attributes:
                      properties:
                        ? ''
                        : properties:
                            url:
                              type: string
                              description: Semi-required, this parameter or the `jobs[files]` is required. This parameter is used to reference files already hosted elsewhere (Dropbox, S3, etc.). This requires providing provider, url, filename, mimetype, and size for each file.
                              format: binary
                          description: Required. Denotes the name for the specific elevation being built.
                          required: []
                          type: object
                      required: []
                      type: object
                    files:
                      properties:
                        ? ''
                        : type: string
                          description: Semi required, this or the `job[file_attachments_attributes][][url]` parameter are required. Use job[files][] parameter to upload local files directly using the file path like `@/path/to/file.pdf`. This is the recommended approach for most use cases.
                      required: []
                      type: object
                    location_line_1:
                      type: string
                      description: The first line of the job's address.
                      default: 123 Hover Way
                    location_line_2:
                      type: string
                      description: The second line of the job's address.
                      default: Building 1
                    customer_name:
                      type: string
                      description: The name of the customer.
                      default: Michael Bluth
                    email_address:
                      type: string
                      description: The email address of the user assigned to the job.
                      default: michael.bluth@hover.to
                    customer_phone:
                      type: string
                      description: The phone number of a customer.
                      default: '8058675309'
                    location_city:
                      type: string
                      description: The city of the job's address.
                      default: Los Angeles
                    location_region:
                      type: string
                      description: The two character state value.
                      default: CA
                    location_postal_code:
                      type: integer
                      description: The postal code of the job's address
                      default: 90210
                      format: int32
                    external_identifier:
                      type: string
                      description: A unique identifier generated by the client.
                      default: '8675309'
                  required: []
                  type: object
                workflow:
                  type: string
                  description: Required. "specify_details" - Creates blueprint submission and jobs automatically based on specifications; using specify details requires providing job_attributes[name][],  and job_attributes[deliverable_id][] param . No default.
                  default: specify_details
                job_attributes:
                  properties:
                    name:
                      properties:
                        ? ''
                        : type: string
                          description: Required. Denotes the name for the specific elevation being built.
                      description: Required. The name of the job.
                      required: []
                      type: object
                    deliverable_id:
                      properties:
                        ? ''
                        : type: string
                          description: Required. Denotes the deliverable type for the specific elevation being built.
                      description: Required. The ID value of the desired deliverable, type 2, 3, or 8.
                      required: []
                      type: object
                  required: []
                  type: object
