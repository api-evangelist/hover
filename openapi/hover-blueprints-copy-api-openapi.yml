                              format: binary
                          description: Required. Denotes the name for the specific elevation being built.
                          required: []
                          type: object
                      required: []
                      type: object
                    files:
                      properties:
                        ? ''
                        : type: string
                          description: Semi required, this or the `job[file_attachments_attributes][][url]` parameter are required. Use job[files][] parameter to upload local files directly using the file path like `@/path/to/file.pdf`. This is the recommended approach for most use cases.
                      required: []
                      type: object
                    location_line_1:
                      type: string
                      description: The first line of the job's address.
                      default: 123 Hover Way
                    location_line_2:
