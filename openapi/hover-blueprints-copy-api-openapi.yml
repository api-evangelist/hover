                      default: 90210
                      format: int32
                    external_identifier:
                      type: string
                      description: A unique identifier generated by the client.
                      default: '8675309'
                  required: []
                  type: object
                workflow:
                  type: string
                  description: Required. "specify_details" - Creates blueprint submission and jobs automatically based on specifications; using specify details requires providing job_attributes[name][],  and job_attributes[deliverable_id][] param . No default.
                  default: specify_details
                job_attributes:
                  properties:
