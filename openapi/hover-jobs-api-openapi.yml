openapi: 3.2.0
info:
  title: Hover Jobs API
  version: '1.0'
  description: 'Operations tagged Jobs across 2 of this provider''s published API definitions: hover-api-v3-openapi.yml, hover-rest-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://hover.to
- url: https://sandbox.hover.to
- url: https://ehi.hover.to
tags:
- name: Jobs
paths:
  /api/v1/jobs/{job_id}:
    patch:
      summary: Update a Job
      description: Update supported metadata fields on an existing Hover job
      operationId: update-a-job
      parameters:
      - name: job_id
        in: path
        description: The Hover Job ID.
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                job:
                  properties:
                    name:
                      type: string
                      description: A name for this job.
                    location_line_1:
                      type: string
                      description: First line of this job's address.
                    location_line_2:
                      type: string
                      description: Second line of this job's address.
                    location_city:
                      type: string
                      description: The city of this job's address.
                    location_region:
                      type: string
                      description: The state of this job's address.
                    location_postal_code:
                      type: string
                      description: The postal code of this job's address.
                    location_country:
                      type: string
                      description: The country code of this job's address
                    external_identifier:
                      type: string
                      description: A unique identifier generated by the client. This can be anything you want and won't be changed. It can be used to reference an ID in the client application's database.
                    suppress_email:
                      type: string
                      description: If a value other than false is given for this attribute then all emails related to this job will be suppressed. That includes capture request emails.
                  required: []
                  type: object
                current_user_email:
                  type: string
                  description: Required. The internal user that you want to assign the job to. Alternatively you can also use the current_user_id param.
                current_user_id:
                  type: string
                  description: Required. The internal user that you want to assign the job to. Alternatively you can also use the current_user_id param.
          multipart/form-data:
            schema:
              type: object
              properties:
                job:
                  properties:
                    name:
                      type: string
                      description: A name for this job.
                    location_line_1:
                      type: string
                      description: First line of this job's address.
                    location_line_2:
                      type: string
                      description: Second line of this job's address.
                    location_city:
                      type: string
                      description: The city of this job's address.
                    location_region:
                      type: string
                      description: The state of this job's address.
                    location_postal_code:
                      type: string
                      description: The postal code of this job's address.
                    location_country:
                      type: string
                      description: The country code of this job's address
                    external_identifier:
                      type: string
                      description: A unique identifier generated by the client. This can be anything you want and won't be changed. It can be used to reference an ID in the client application's database.
                    suppress_email:
                      type: string
                      description: If a value other than false is given for this attribute then all emails related to this job will be suppressed. That includes capture request emails.
                  required: []
                  type: object
                current_user_email:
                  type: string
                  description: Required. The internal user that you want to assign the job to. Alternatively you can also use the current_user_id param.
                current_user_id:
                  type: string
                  description: Required. The internal user that you want to assign the job to. Alternatively you can also use the current_user_id param.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '500':
          description: '500'
          content:
            text/plain:
              examples:
                Result:
                  value: "{\n    \"status\": 500,\n    \"error\": \"Internal Server Error\"\n}"
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 500
                    default: 0
                  error:
                    type: string
                    example: Internal Server Error
      deprecated: false
      tags:
      - Jobs
      security:
      - sec0: []
    servers:
    - url: https://hover.to
  /api/v1/jobs/{job_id}/estimate_production_lists:
    get:
      description: List Estimates on a Job by Job ID
      responses:
        '200':
          description: ''
      parameters:
      - in: path
        name: job_id
        schema:
          type: integer
        required: true
        description: ID of the Job you want to get estimate IDs for.
      operationId: get_api-v1-jobs-job-id-estimate-production-lists
      summary: List Estimates
      tags:
      - Jobs
      security:
      - sec0: []
    servers:
    - url: https://hover.to
  /api/v2/jobs/job_id/reassign:
    post:
      summary: Re-Assign Requesting User
      description: ''
      operationId: re-assign-requesting-user
      parameters:
      - name: job_id
        in: path
        schema:
          type: string
        required: true
      - name: user_id
        in: query
        description: The ID value of the person who the job is being re-assigned to as the "requesting user"
        schema:
          type: string
      - name: current_user_id
        in: query
        description: The current user ID -- must be an admin in the authenticated org. Either current_user_id or current_user_email is required.
        schema:
          type: string
      - name: current_user_email
        in: query
        description: The current user email -- must be an admin on the authenticated org. Either current_user_id or current_user_email is required.
        schema:
          type: string
      responses:
        '204':
          description: '204'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Jobs
      security:
      - sec0: []
    servers:
    - url: https://hover.to
  /api/v2/jobs/{job_id}/set_test_state.json:
    patch:
      summary: Single Structure Test Jobs
      description: This endpoint allows a mocked single-structure test job to be created for development testing; this endpoint does fire realistic webhooks.
      operationId: update-job-test-state-single-structure
      parameters:
      - name: state
        in: query
        description: The end job state to test. Options include 'complete' or 'failed'.
        required: true
        schema:
          type: string
      - name: current_user_id
        in: query
        description: Required. The user ID of an admin user in the authenticated Hover org.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Jobs
      security:
      - sec0: []
    servers:
    - url: https://hover.to
  /api/v3/jobs:
    get:
      summary: List Jobs
      description: ''
      operationId: list-jobs
      parameters:
      - name: search
        in: query
        description: Returns job with matching search parameter across job name, address, or user. Minimum Three characters are required.
        schema:
          type: string
          default: Test
      - name: archived
        in: query
        description: Default is `false`. When `true`, only archived jobs are returned.
        schema:
          type: boolean
          default: false
      - name: example
        in: query
        description: Default is `false`. When true, only example jobs are returned.
        schema:
          type: boolean
          default: false
      - name: sort_order
        in: query
        description: Defaults to DESC Allowed values are ASC or DESC.
        schema:
          type: string
          default: DESC
      - name: sort_by
        in: query
        description: Sorts jobs by timestamp and used with the `sort_order` parameter. Allowed values are  completed_at, created_at, or updated_at.
        schema:
          type: string
          default: updated_at
      - name: updated_since
        in: query
        description: Seconds since the EPOCH. Only return jobs that have been updated since this time.
        schema:
          type: string
          default: '1709233469'
      - name: per
        in: query
        description: Default is 25 results. The response body can include up to 100 jobs.
        schema:
          type: integer
          format: int32
          default: 25
      - name: page
        in: query
        description: Used to paginate through results. This parameter indicates which page to return.
        schema:
          type: integer
          format: int32
          default: 1
      - name: deliverable_ids[]
        in: query
        description: Returns jobs with models of the selected deliverable type, 1, 2, 3, 5, 6, 8.
        schema:
          type: array
          items:
            type: integer
            format: int32
      - name: reconstruction_states[]
        in: query
        description: Returns jobs of the supplied reconstruction state, "failed" or "completed".  Reconstruction state indicates all the models on the job have been processed by Hover and at least one succeeded. The models on the jobs may be a mix of failed and completed states.
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '300':
          description: '300'
          content:
            text/plain:
              examples:
                Result:
                  value: ''
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      tags:
      - Jobs
      security:
      - sec0: []
    servers:
    - url: https://hover.to
  /api/v3/jobs/test_job:
    post:
      summary: Multi-Structure Test Jobs
      description: ''
      operationId: multi-structure-test-jobs
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                job_preset:
                  type: string
                  description: Required. Preset of the type of job to create. `multi_structure_exterior` is currently the only allowed value.
                  default: multi_structure_exterior
                state:
                  type: string
                  description: Required. Indicates the final state of the test job. Allowed values are `complete` and `failed`
                  default: complete (default), failed
                failed_models_count:
                  type: string
                  description: Indicates how many models you would like to be int he failed state on the resultant job. 0, 1, 2. Not including this param is the same as 0.
                  default: '1'
                current_user_id:
                  type: string
                  description: The current_user_id or current_user_email of the current user.
                  default: '111111111'
          multipart/form-data:
            schema:
              type: object
              properties:
                job_preset:
                  type: string
                  description: Required. Preset of the type of job to create. `multi_structure_exterior` is currently the only allowed value.
                  default: multi_structure_exterior
                state:
                  type: string
                  description: Required. Indicates the final state of the test job. Allowed values are `complete` and `failed`
                  default: complete (default), failed
                failed_models_count:
                  type: string
                  description: Indicates how many models you would like to be int he failed state on the resultant job. 0, 1, 2. Not including this param is the same as 0.
                  default: '1'
                current_user_id:
                  type: string
                  description: The current_user_id or current_user_email of the current user.
                  default: '111111111'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"success\": true\n}"
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    default: true
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '422':
          description: '422'
          content:
            text/plain:
              examples:
                Result:
                  value: "{\n    \"error\": {\n        \"job\": \"Invalid failed_models_count: 4. Allowed: 0, 1, 2\"\n    }\n}"
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      job:
                        type: string
                        example: 'Invalid failed_models_count: 4. Allowed: 0, 1, 2'
      deprecated: false
      tags:
      - Jobs
      security:
      - sec0: []
    servers:
    - url: https://hover.to
  /api/v3/jobs/{job_id}:
    get:
      summary: Show Job Details
      description: Use this endpoint to show all details of a Job given the job id. This endpoint returns almost all data needed on a job. Use this endpoint to get links to job measurements as json, xlsx, skp, xml, as well as job images.
      operationId: show-job-details
      parameters:
      - name: job_id
        in: path
        description: The ID of the Hover job.
        schema:
          type: integer
          format: int32
          default: 8675309
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      tags:
      - Jobs
      security:
      - sec0: []
    servers:
    - url: https://hover.to
  /api/v3/jobs/{job_id}/job_share:
    post:
      summary: Create Job Share Link with Password
      description: ''
      operationId: create-job-share-link-with-password
      parameters:
      - name: job_id
        in: path
        description: ID of the job to share.
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - viewer_version
              properties:
                viewer_version:
                  type: string
                  description: The type of viewer to use for the shared link.
                password_protected:
                  type: string
                  description: 'Whether to password-protect the share. Note: `virtual-walkthrough` always requires password protection.'
                  default: 'true'
          multipart/form-data:
            schema:
              type: object
              required:
              - viewer_version
              properties:
                viewer_version:
                  type: string
                  description: The type of viewer to use for the shared link.
                password_protected:
                  type: string
                  description: 'Whether to password-protect the share. Note: `virtual-walkthrough` always requires password protection.'
                  default: 'true'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": 12345,\n  \"token\": \"zvXwgDcfjiL1q45NuScg\",\n  \"password_protected\": false,\n  \"expires_at\": \"2024-03-15T12:00:00.000Z\",\n  \"created_at\": \"2024-01-30T12:00:00.000Z\",\n  \"updated_at\": \"2024-01-30T12:00:00.000Z\",\n  \"url\": \"https://hover.to/shared/zvXwgDcfjiL1q45NuScg\",\n  \"generated_password\": null\n}"
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 12345
                    default: 0
                  token:
                    type: string
                    example: zvXwgDcfjiL1q45NuScg
                  password_protected:
                    type: boolean
                    example: false
                    default: true
                  expires_at:
                    type: string
                    example: '2024-03-15T12:00:00.000Z'
                  created_at:
                    type: string
                    example: '2024-01-30T12:00:00.000Z'
                  updated_at:
                    type: string
                    example: '2024-01-30T12:00:00.000Z'
                  url:
                    type: string
                    example: https://hover.to/shared/zvXwgDcfjiL1q45NuScg
                  generated_password: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '422':
          description: '422'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"errors\": [\"Job must exist\", \"Token has already been taken\"]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                      example: Job must exist
      deprecated: false
      tags:
      - Jobs
      security:
      - sec0: []
    servers:
    - url: https://hover.to
  /api/v1/jobs:
    post:
      tags:
      - Jobs
      summary: Create a Job
      description: '## Create A Job


        This endpoint creates a new job within your organization that is ready for image capture within the mobile application (where a homeowner, field tech etc., could capture the photos.).'
      operationId: createAJob
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                current_user_email:
                  description: Required. The internal user that you want to assign the job to. Alternatively you can also use the current_user_id param.
                  type: string
                  example: ''
                current_user_id:
                  type: string
                  example: ''
                job[customer_email]:
                  description: The email address of the customer. Usually the homeowner.
                  type: string
                  example: homeowner@hover.to
                job[customer_name]:
                  description: The name of the customer. Usually the homeowner.
                  type: string
                  example: Michael Bluth
                job[customer_phone]:
                  description: The phone number of the customer. Usually the homeowner.
                  type: string
                  example: '5558675309'
                job[deliverable_id]:
                  description: 'Supported deliverable_ids: `2`(Roof Only), `3`(Complete), `5`(Total Living Area Plus), `6` (Total Living Area), `7` (Capture Only, Photos Only), `8` (Interior)'
                  type: string
                  example: '3'
                job[external_identifier]:
                  description: A unique identifier generated by the client. This can be anything you want and won't be changed. It can be used to reference an ID in the client application's database.
                  type: string
                  example: '54965'
                job[location_city]:
                  description: The city of this job's address
                  type: string
                  example: Los Angeles
                job[location_country]:
                  description: The postal code of this job's address
                  type: string
                  example: US
                job[location_line_1]:
                  description: First line of this job's address
                  type: string
                  example: 123 HOVER Way
                job[location_line_2]:
                  description: Second line of this job's address
                  type: string
                  example: ''
                job[location_postal_code]:
                  description: The postal code of this job's address
                  type: string
                  example: '90210'
                job[location_region]:
                  description: The state of this job's address
                  type: string
                  example: CA
                job[name]:
                  description: A name for this job.
                  type: string
                  example: Bluth Development House 1
                job[suppress_email]:
                  description: If a value other than false is given for this attribute then all emails related to this job will be suppressed. That includes capture request emails.
                  type: string
                  example: ''
      responses:
        '201':
          description: 201 Created
          headers:
            Alt-Svc:
              schema:
                type: string
                example: h3=":443"; ma=86400
            CF-Cache-Status:
              schema:
                type: string
                example: DYNAMIC
            CF-Ray:
              schema:
                type: string
                example: 7ec7f85b1d839452-SJC
            Cache-Control:
              schema:
                type: string
                example: max-age=0, private, must-revalidate
            Connection:
              schema:
                type: string
                example: keep-alive
            Content-Length:
              schema:
                type: string
                example: '22540'
            Date:
              schema:
                type: string
                example: Tue, 25 Jul 2023 22:51:53 GMT
            ETag:
              schema:
                type: string
                example: W/"f02b645a94a580f16bcd51ce64ff83d0"
            Location:
              schema:
                type: string
                example: /api/v1/jobs/9824755
            Referrer-Policy:
              schema:
                type: string
                example: strict-origin-when-cross-origin
            Server:
              schema:
                type: string
                example: cloudflare
            Set-Cookie:
              schema:
                type: string
                example: _hyperion_session=ecfea63a3fec9c30625550e4c86ba741; domain=.hover.to; path=/; expires=Thu, 24 Aug 2023 22:51:53 GMT; secure; HttpOnly; SameSite=Lax
            Strict-Transport-Security:
              schema:
                type: string
                example: max-age=0
            Vary:
              schema:
                type: string
                example: Origin, Accept-Encoding
            Via:
              schema:
                type: string
                example: 1.1 google
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
            X-Download-Options:
              schema:
                type: string
                example: noopen
            X-Frame-Options:
              schema:
                type: string
                example: ALLOWALL
            X-Permitted-Cross-Domain-Policies:
              schema:
                type: string
                example: none
            X-Request-Id:
              schema:
                type: string
                example: 8824c805-42c5-439a-9ca1-e099d9a4095b
            X-Runtime:
              schema:
                type: string
                example: '0.335121'
            X-XSS-Protection:
              schema:
                type: string
                example: '0'
          content:
            application/json:
              schema:
                type: object
                properties:
                  job:
                    type: object
                    properties:
                      additional_captured_jobs:
                        type: array
                        items: {}
                        example: []
                      additional_information:
                        example: null
                      approved:
                        type: boolean
                        example: true
                      archived:
                        type: boolean
                        example: false
                      blueprint:
                        type: boolean
                        example: false
                      can_access_hi_def_rendering:
                        type: boolean
                        example: true
                      can_order_hi_def_rendering:
                        type: boolean
                        example: true
                      can_request_hi_def_rendering:
                        type: boolean
                        example: true
                      capture_request:
                        example: null
                      capture_session_identifier:
                        example: null
                      client_identifier:
                        type: string
                        example: 521b9a3b-759b-49ea-9b1e-7632aec3f45a
                      complete_expedited:
                        type: boolean
                        example: false
                      completed_at:
                        example: null
                      contractor_estimate_sent_to:
                        example: null
                      created_at:
                        type: string
                        example: '2023-07-25T22:51:53.552Z'
                      customer_contact:
                        example: null
                      customer_contact_only_by_email:
                        type: boolean
                        example: false
                      customer_email:
                        type: string
                        example: homeowner@hover.to
                      customer_first_name:
                        example: null
                      customer_name:
                        type: string
                        example: Michael Bluth
                      customer_notes:
                        example: null
                      customer_phone:
                        type: string
                        example: '5558675309'
                      deliverable_id:
                        type: number
                        example: 3
                      estimated_hours_to_completion:
                        type: number
                        example: 0
                      example:
                        type: boolean
                        example: false
                      external_identifier:
                        type: string
                        example: '54965'
                      external_identifier_label:
                        type: string
                        example: Lead Number
                      file_attachments:
                        type: array
                        items: {}
                        example: []
                      hero_image:
                        example: null
                      id:
                        type: number
                        example: 9824755
                      job_assignments:
                        type: array
                        items:
                          type: object
                          properties:
                            archived:
                              type: boolean
                              example: false
                            archived_at:
                              example: null
                            assigned_by:
                              example: null
                            created_at:
                              type: string
                              example: '2023-07-25T22:51:53.577Z'
                            id:
                              type: number
                              example: 14905200
                            job_id:
                              type: number
                              example: 9824755
                            kind:
                              type: string
                              example: creator
                            org:
                              type: object
                              properties:
                                ancestral_name:
                                  type: string
                                  example: HOVER > Pro > Salesforce Package Development > Developer Docs Org
                                customer_display_name:
                                  type: string
                                  example: Developer Docs Org
                                id:
                                  type: number
                                  example: 600530
                                kind:
                                  type: string
                                  example: dealer
                                model_price:
                                  type: number
                                  example: 4995
                                name:
                                  type: string
                                  example: Developer Docs Org
                                ordering_email:
                                  type: string
                                  example: ''
                                parent_id:
                                  type: number
                                  example: 492855
                                sort_order:
                                  example: null
