      summary: Create a Job
      description: "## Create A Job\n\nThis endpoint creates a new job within your organization that is ready for image [capture within the mobile application](https://help.hover.to/en/articles/4278777-how-to-capture-photos-with-hover) (where a homeowner, field tech etc., could capture the photos.). It isn't necessary to create a Hover job via the API, although it may be useful depending on the needs of your integration.\n\n### Why would I use this?\n\nShould I use the Job Creation endpoint?\n\n\U0001F6D1 Please note, we do not recommend using this [Create a Job endpoint](https://developers.hover.to/reference/createajob) in most cases. Job creation from this endpoint does not kick off any kind of webhook event denoting the job has been captured which is essential to most API integrations. In lieu of this endpoint we recommend using Capture requests, and the [Create Capture Requests](https://developers.hover.to/reference/createacapturerequest) endpoint which also creates Jobs, but with capture\
        \ completed statuses; meaning you get webhook events for both Job states and Capture Request States. Learn more [here.](https://developers.hover.to/reference/capture-requests) \U0001F6D1\n\nThis end point might be used to create a Hover job after a request for a quote is submited by a homeowner. Below are some common data leveraged from this endpoint.\n\n- The ability to know the ID of a Hover job before it is uploaded\n    \n    - _When creating jobs directly from the mobile application, the Hover job identifier is created after upload._\n        \n- The ability to pre-fill information relating to a Hover capture\n    \n    - _When creating a job directly from the mobile application, the capturing user will be asked to provide metadata such as the address and customer name._\n        \n\nCreating a job is different than creating a capture request:\n\nCreating a job provides a shell job that is visible for a given user within the HOVER app, but it does not send a direct notification\
        \ or invite. This is typically used for creating new jobs to be captured by HOVER users within your organization.\n\nCreating a capture request will create a job, but it will also send an invite to the capturing user.\n\n**\U0001F6D1 Additional Params Needed for Org-Level Auth** **\U0001F6D1**\n\nThis endpoint, when used with Org-level OAuth 2.0, requires a `params[current_user_email]` or >`params[current_user_id]`. Otherwise, a 422 unprocessable entity may be returned as a response.\n\n### Response Code Snippet\n\nSee an example 201 response here, then follow below to learn more about the request and what makes up the responses.\n\n``` json\n{\n    \"job\": {\n        \"id\": 9824755,\n        \"org_id\": 600530,\n        \"name\": \"Bluth Development House 1\",\n        \"org_name\": \"Developer Docs Org\",\n        \"user_name\": \"geoff.hull+devdocs@hoverinc.com\",\n        \"user_id\": 1537006,\n        \"location_line_1\": \"123 HOVER Way\",\n        \"location_line_2\": \"\
