openapi: 3.2.0
info:
  title: hover-api-v3 Instant Design API
  version: '3'
servers:
- url: https://hover.to
security:
- sec0: []
tags:
- name: Instant Design
paths:
  /api/v1/instant_design/images:
    get:
      summary: List Instant Design Images
      description: ''
      operationId: list-instant-design-images
      parameters:
      - name: job_id
        in: query
        description: This or the lead_id is required. The ID of the Instant Design job.
        schema:
          type: integer
          format: int32
          default: 8675309
      - name: lead_id
        in: query
        description: This or Job ID is required. The ID of the Lead.
        schema:
          type: integer
          format: int32
          default: null
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"images\": [\n    {\n      \"id\": 1865953\n    },\n    {\n      \"id\": 1865937\n    },\n    {\n      \"id\": 1865940\n    },\n    {\n      \"id\": 1865942\n    },\n    {\n      \"id\": 1865990\n    },\n    {\n      \"id\": 1865945\n    },\n    {\n      \"id\": 1865991\n    }\n  ]\n}\n\n\n\n"
              schema:
                type: object
                properties:
                  images:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1865953
                          default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Instant Design
  /api/v1/instant_design/images/{image_id}:
    get:
      summary: Show Instant Design Image
      description: ''
      operationId: show-instant-design-image
      parameters:
      - name: image_id
        in: path
        description: The ID of the Instant Design image.
        schema:
          type: integer
          format: int32
          default: 1842252
        required: true
      - name: job_id
        in: query
        description: Required. ID of the job associated with the Instant Design image
        schema:
          type: integer
          format: int32
          default: 8675309
      deprecated: false
      tags:
      - Instant Design
  /api/v1/instant_design/leads:
    get:
      summary: List Instant Design Leads
      description: Use this endpoint to list all lead information submitted through the Instant Design lead form associated with the authenticated organization.
      operationId: list-instant-design-leads
      parameters:
      - name: org_id
        in: query
        description: Required. The ID of the organization the integration is authenticated with.
        schema:
          type: integer
          format: int32
          default: 8675309
      - name: per
        in: query
        description: Used for pagination. The number of leads to return in a payload. Default is 25.
        schema:
          type: integer
          format: int32
          default: 25
      - name: page
        in: query
        description: Used for pagination. The page number to return.
        schema:
          type: string
          default: '1'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Instant Design
  /api/v1/instant_design/leads/{lead_id}:
    get:
      summary: Show Instant Design Lead Details
      description: Use this endpoint to retrieve detailed information for a single Instant Design lead given the lead ID
      operationId: show-instant-design-lead
      parameters:
      - in: path
        name: lead_id
        schema:
          type: string
        required: true
        description: Required. The ID of the lead you are requesting details for.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Instant Design
