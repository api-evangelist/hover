paths:
  /api/v2/notes.json:
    get:
      summary: List Notes
      description: ''
      operationId: list-notes
      parameters:
      - name: job_id
        in: query
        description: Required. The ID of the job to obtain the notes for.
        schema:
          type: integer
          format: int32
          default: 4478962
      deprecated: false
      tags:
      - Notes.json
    post:
      summary: Create Note
      description: ''
      operationId: create-note
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  properties:
                    body:
                      type: string
                      description: The content of the note
                      default: This is a note!
                    job_id:
                      type: integer
                      description: The ID of the job to add a note to.
                      default: 117456
                      format: int32
                  required: []
                  type: object
                current_user_email:
                  type: string
                  description: Required. The email address of a user who has access to the property in Hover.
                  default: michael@bluthcompany.com
          multipart/form-data:
            schema:
              type: object
              properties:
                note:
                  properties:
                    body:
                      type: string
                      description: The content of the note
                      default: This is a note!
                    job_id:
                      type: integer
                      description: The ID of the job to add a note to.
                      default: 117456
                      format: int32
                  required: []
                  type: object
                current_user_email:
                  type: string
                  description: Required. The email address of a user who has access to the property in Hover.
                  default: michael@bluthcompany.com
      responses:
        '200':
          description: '200'
