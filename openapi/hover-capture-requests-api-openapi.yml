paths:
  /api/v2/capture_requests:
    get:
      summary: List Capture Requests
      description: ''
      operationId: list-capture-requests
      parameters:
      - name: current_user_id
        in: query
        description: Required. The ID of a user within the authenticated organization. Returns capture requests associated with this user.
        schema:
          type: integer
          format: int32
          default: 8675309
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Capture Requests
    post:
      summary: Create a Capture Request
      description: ''
      operationId: create-capture-request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                capture_request:
                  properties:
                    capturing_user_email:
                      type: string
                      description: Required. The email address of the person this capture request will be sent to.
                      default: homeowner@bluthcompanies.com
                    capturing_user_phone:
                      type: string
                      description: Optional. The phone number of the person this capture request will be sent to.
                      default: '8058675309'
                    capturing_user_name:
                      type: string
                      description: Required. The name of the person that will be capturing the property. Most likely the homeowner's name.
                      default: Lucille Bluth
                    signup_type:
                      type: string
                      description: Optional. Defaults to `homeowner`. Allowed values are `homeowner` and `pro`, designated by the type of user capturing the property.
                      default: homeowner
                    job_attributes:
                      properties:
                        name:
                          type: string
                          description: A name for the job.
                          default: The Big House
                        deliverable_id:
                          type: string
                          description: 'Supported deliverable_ids: 2(Roof Only), 3(Complete), 5(Total Living Area Plus), 6 (Total Living Area), 7 (Capture Only, Photos Only), 8 (Interior)'
                          default: '3'
                        external_identifier:
                          type: string
                          description: A unique identifier generated by the client. This can be anything you want and won't be changed. It can be used to reference an ID in the an external system database.
                          default: '8675309'
                        location_city:
                          type: string
                          description: The city where this job is located.
                          default: Denver
                        location_line_1:
                          type: string
                          description: First line of this job's address
                          default: 1701 Bryant Street
                        location_line_2:
                          type: string
                          description: Second line of this job's address
                          default: Apartment 22
                        location_postal_code:
                          type: string
                          description: The postal code of this job's address
                          default: '80204'
                        location_region:
                          type: string
                          description: The 2 character state code where this job resides.
                          default: CO
                        suppress_email:
                          type: boolean
                          description: If a value other than false is given for this attribute then all emails related to this job will be suppressed. That includes capture request emails.
                          default: false
                        wallet_id:
                          type: integer
                          description: Optional. By passing this parameter you can specify the billing information for the job.
                          default: 67821
                          format: int32
                      required: []
                      type: object
                    suppress_text_messages:
                      type: string
                      description: If a value other than false is given for this attribute then all SMS related to this job will be suppressed. That includes capture request SMS..
                      default: 'false'
                    inspection_workflow_id:
                      type: string
                      default: 'null'
                      description: 'An inspection workflow ID to allow the capturing user to perform an inspection (in addition to a scan) upon receiving a Capture Request. '
                  required: []
                  type: object
                current_user_email:
                  type: string
                  description: The internal user that you want to assign the job to. Alternatively, you can also use the `current_user_id` param.
                  default: michael@bluthcompanies.com
                current_user_id:
                  type: integer
                  description: The ID value of the user who you want to assign the job to. Alternatively, current_user_email can be used.
                  default: 643197
                  format: int32
          multipart/form-data:
            schema:
              type: object
              properties:
                capture_request:
                  properties:
                    capturing_user_email:
                      type: string
                      description: Required. The email address of the person this capture request will be sent to.
                      default: homeowner@bluthcompanies.com
                    capturing_user_phone:
                      type: string
                      description: Optional. The phone number of the person this capture request will be sent to.
                      default: '8058675309'
                    capturing_user_name:
                      type: string
                      description: Required. The name of the person that will be capturing the property. Most likely the homeowner's name.
                      default: Lucille Bluth
                    signup_type:
                      type: string
                      description: Optional. Defaults to `homeowner`. Allowed values are `homeowner` and `pro`, designated by the type of user capturing the property.
                      default: homeowner
                    job_attributes:
                      properties:
                        name:
                          type: string
                          description: A name for the job.
                          default: The Big House
                        deliverable_id:
                          type: string
                          description: 'Supported deliverable_ids: 2(Roof Only), 3(Complete), 5(Total Living Area Plus), 6 (Total Living Area), 7 (Capture Only, Photos Only), 8 (Interior)'
                          default: '3'
                        external_identifier:
                          type: string
                          description: A unique identifier generated by the client. This can be anything you want and won't be changed. It can be used to reference an ID in the an external system database.
                          default: '8675309'
                        location_city:
                          type: string
                          description: The city where this job is located.
                          default: Denver
                        location_line_1:
                          type: string
                          description: First line of this job's address
                          default: 1701 Bryant Street
                        location_line_2:
                          type: string
                          description: Second line of this job's address
                          default: Apartment 22
                        location_postal_code:
                          type: string
                          description: The postal code of this job's address
                          default: '80204'
                        location_region:
                          type: string
                          description: The 2 character state code where this job resides.
                          default: CO
                        suppress_email:
                          type: boolean
                          description: If a value other than false is given for this attribute then all emails related to this job will be suppressed. That includes capture request emails.
                          default: false
                        wallet_id:
                          type: integer
                          description: Optional. By passing this parameter you can specify the billing information for the job.
                          default: 67821
                          format: int32
                      required: []
                      type: object
                    suppress_text_messages:
                      type: string
                      description: If a value other than false is given for this attribute then all SMS related to this job will be suppressed. That includes capture request SMS..
                      default: 'false'
                  required: []
                  type: object
                current_user_email:
                  type: string
                  description: The internal user that you want to assign the job to. Alternatively, you can also use the `current_user_id` param.
                  default: michael@bluthcompanies.com
                current_user_id:
                  type: integer
                  description: The ID value of the user who you want to assign the job to. Alternatively, current_user_email can be used.
                  default: 643197
                  format: int32
