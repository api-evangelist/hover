paths:
  /api/v1/job_shares:
    get:
      summary: List Job Share Links
      description: ''
      operationId: list-job-share-links
      parameters:
      - name: current_user_id
        in: query
        description: Required. The ID of a user to list job shares for.
        schema:
          type: integer
          format: int32
          default: 8675309
      deprecated: false
      tags:
      - Job Shares
  /api/v1/job_shares/{job_share_id}:
    get:
      summary: Show Job Share Link
      description: ''
      operationId: show-job-share-link
      parameters:
      - name: job_share_id
        in: path
        description: ID of the specific job share
        schema:
          type: integer
          format: int32
          default: 321654987
        required: true
      - name: current_user_id
        in: query
        description: Required. ID of a user with access to the job in Hover.
        schema:
          type: integer
          format: int32
          default: 8675309
      deprecated: false
      tags:
      - Job Shares
    delete:
      summary: Delete Job Share Link
      description: ''
      operationId: delete-job-share-link
      parameters:
      - name: job_share_id
        in: path
        description: ID of the job share link to delete
        schema:
          type: integer
          format: int32
          default: 75395125
        required: true
      - name: current_user_id
        in: query
        description: Required. The ID of a user with write access to the Job Share Link.
        schema:
          type: integer
          format: int32
          default: 8675309
