openapi: 3.2.0
info:
  title: hover-api-v3 Orgs API
  version: '3'
servers:
- url: https://hover.to
security:
- sec0: []
tags:
- name: Orgs
paths:
  /api/v1/orgs:
    get:
      summary: Show Organization Details
      description: ''
      operationId: show-organization-details
      deprecated: false
      tags:
      - Orgs
  /api/v1/orgs/{org_id}:
    patch:
      summary: Update Organization
      description: ''
      operationId: update-organization
      parameters:
      - name: org_id
        in: path
        description: The ID of the organization you are updating
        schema:
          type: integer
          format: int32
          default: 468531
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                org:
                  properties:
                    name:
                      type: string
                      description: The Organization's name as it is displayed to logged in users.
                      default: Hover Test
                    customer_display_name:
                      type: string
                      description: The Organization's name as it is displayed to members outside of the organization.
                      default: Hover Test Org
                    preferences_attributes:
                      properties:
                        external_identifier_label:
                          type: string
                          description: The label used for any job's external identifier. This identifier is displayed in Hover frontend clients.
                          default: Claim Number
                        external_identifier_required:
                          type: string
                          description: Allowed values are true and false. This controls if fronend clients will require users to enter an external identifier when creating a job.
                          default: 'false'
                      required: []
                      type: object
                  required: []
                  type: object
          multipart/form-data:
            schema:
              type: object
              properties:
                org:
                  properties:
                    name:
                      type: string
                      description: The Organization's name as it is displayed to logged in users.
                      default: Hover Test
                    customer_display_name:
                      type: string
                      description: The Organization's name as it is displayed to members outside of the organization.
                      default: Hover Test Org
                    preferences_attributes:
                      properties:
                        external_identifier_label:
                          type: string
                          description: The label used for any job's external identifier. This identifier is displayed in Hover frontend clients.
                          default: Claim Number
                        external_identifier_required:
                          type: string
                          description: Allowed values are true and false. This controls if fronend clients will require users to enter an external identifier when creating a job.
                          default: 'false'
                      required: []
                      type: object
                  required: []
                  type: object
      deprecated: false
      tags:
      - Orgs
  /api/v1/orgs/{org_id}/users.json:
    post:
      summary: Invite User
      description: ''
      operationId: invite-user
      parameters:
      - name: org_id
        in: path
        description: The ID of the Hover organization to add a user to.
        schema:
          type: integer
          format: int32
          default: 44653
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  properties:
                    email:
                      type: string
                      description: Required. The user's email address.
                      default: tobias.funke@bluthcompanies.com
                    first_name:
                      type: string
                      description: The user's first name
                      default: Tobias
                    last_name:
                      type: string
                      description: The user's last name
                      default: Funke
                    mobile_phone:
                      type: string
                      description: The user's phone number
                      default: '8529637412'
                    require_job_approval:
                      type: boolean
                      description: Default is `false`. Indicates if jobs captured by this user require admin approval.
                      default: false
                  required: []
                  type: object
                acl_template:
                  type: string
                  description: Default is `job_manager`. Allowed values are `job_manager` and `admin` and indicates a user's permission level.
                  default: job_manager
          multipart/form-data:
            schema:
              type: object
              properties:
                user:
                  properties:
                    email:
                      type: string
                      description: Required. The user's email address.
                      default: tobias.funke@bluthcompanies.com
                    first_name:
                      type: string
                      description: The user's first name
                      default: Tobias
                    last_name:
                      type: string
                      description: The user's last name
                      default: Funke
                    mobile_phone:
                      type: string
                      description: The user's phone number
                      default: '8529637412'
                    require_job_approval:
                      type: boolean
                      description: Default is `false`. Indicates if jobs captured by this user require admin approval.
                      default: false
                  required: []
                  type: object
                acl_template:
                  type: string
                  description: Default is `job_manager`. Allowed values are `job_manager` and `admin` and indicates a user's permission level.
                  default: job_manager
      deprecated: false
      tags:
      - Orgs
  /api/v1/orgs/{org_id}/users/{user_id}/archive:
    patch:
      summary: Remove User From Org
      description: ''
      operationId: remove-user-from-org
      parameters:
      - name: org_id
        in: path
        description: Required. The ID of the organization that the user belongs to.
        schema:
          type: integer
          format: int32
          default: 44865
        required: true
      - name: user_id
        in: path
        description: Required. The ID of the user to be removed.
        schema:
          type: integer
          format: int32
          default: 1776549
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                current_user_id:
                  type: integer
                  description: Required. The ID of an admin user within the authenticated organization.
                  default: 8675309
                  format: int32
          multipart/form-data:
            schema:
              type: object
              properties:
                current_user_id:
                  type: integer
                  description: Required. The ID of an admin user within the authenticated organization.
                  default: 8675309
                  format: int32
      deprecated: false
      tags:
      - Orgs
  /api/v1/orgs/{org_id}/users/{user_id}/send_invitation_instructions.json:
    post:
      summary: Send Invitation Email
      description: ''
      operationId: send-invitation-email
      parameters:
      - name: org_id
        in: path
        description: Required. The ID of the authenticated Hover organization.
        schema:
          type: integer
          format: int32
          default: 447895
        required: true
      - name: user_id
        in: path
        description: Required. The ID of the user to send the invitation email to.
        schema:
          type: integer
          format: int32
          default: 11789456
        required: true
      - name: current_user_id
        in: query
        description: Required. The ID of an admin user on the authenticated Hover organization.
        schema:
          type: integer
          format: int32
          default: 8675309
      deprecated: false
      tags:
      - Orgs
  /api/v2/orgs/administered:
    get:
      summary: List Organization Tree
      description: ''
      operationId: list-organization-tree
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Orgs
