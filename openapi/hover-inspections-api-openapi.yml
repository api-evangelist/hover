openapi: 3.2.0
info:
  title: Hover Inspections API
  version: '1.0'
  description: 'Operations tagged Inspections across 2 of this provider''s published API definitions: hover-api-v3-openapi.yml, hover-rest-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://hover.to
- url: https://sandbox.hover.to
- url: https://ehi.hover.to
tags:
- name: Inspections
paths:
  /api/v2/inspections/{inspection_id}/pdf:
    get:
      summary: Get Inspection PDF
      description: ''
      operationId: get-inspection-pdf-1
      parameters:
      - name: inspection_id
        in: path
        description: The ID of the inspection
        schema:
          type: integer
          format: int32
          default: 15277
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Inspections
      security:
      - sec0: []
    servers:
    - url: https://hover.to
  /api/v2/inspections/{inspection_id}:
    parameters:
    - name: inspection_id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Inspections
      summary: Get Inspection Details
      operationId: getInspectionDetails
      responses:
        '200':
          description: 200 OK
          headers:
            CF-Cache-Status:
              schema:
                type: string
                example: DYNAMIC
            CF-Ray:
              schema:
                type: string
                example: 909e9df16ba82ad5-LAX
            Cache-Control:
              schema:
                type: string
                example: max-age=0, private, must-revalidate
            Connection:
              schema:
                type: string
                example: keep-alive
            Content-Encoding:
              schema:
                type: string
                example: gzip
            Date:
              schema:
                type: string
                example: Thu, 30 Jan 2025 04:11:16 GMT
            ETag:
              schema:
                type: string
                example: W/"f5f04afa99012fe7ac4d82c56852c22b"
            Server:
              schema:
                type: string
                example: cloudflare
            Set-Cookie:
              schema:
                type: string
                example: _hyperion_session=f31c1dbcb630781a5809ee1014a05237; domain=hover.to; path=/; expires=Sat, 01 Mar 2025 04:11:16 GMT; secure; httponly; samesite=lax
            Strict-Transport-Security:
              schema:
                type: string
                example: max-age=0
            Transfer-Encoding:
              schema:
                type: string
                example: chunked
            Vary:
              schema:
                type: string
                example: Accept-Encoding, Origin
            Via:
              schema:
                type: string
                example: 1.1 google
            alt-svc:
              schema:
                type: string
                example: h3=":443"; ma=86400
            referrer-policy:
              schema:
                type: string
                example: strict-origin-when-cross-origin
            x-content-type-options:
              schema:
                type: string
                example: nosniff
            x-frame-options:
              schema:
                type: string
                example: ALLOWALL
            x-permitted-cross-domain-policies:
              schema:
                type: string
                example: none
            x-request-id:
              schema:
                type: string
                example: 2bfe334c-1d9d-4794-8ac4-ce1357ed5605
            x-runtime:
              schema:
                type: string
                example: '0.124231'
            x-xss-protection:
              schema:
                type: string
                example: '0'
          content:
