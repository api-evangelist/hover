openapi: 3.2.0
info:
  title: hover-api-v3 Webhooks API
  version: '3'
servers:
- url: https://hover.to
security:
- sec0: []
tags:
- name: Webhooks
paths:
  /api/v2/webhooks:
    get:
      summary: List Webhooks
      description: ''
      operationId: list-webhooks
      parameters:
      - name: page
        in: query
        description: To paginate the API response if more than one page is returned
        schema:
          type: integer
          format: int32
          default: 1
      deprecated: false
      tags:
      - Webhooks
    post:
      summary: Register Webhook
      description: This endpoint registers a webhook to be used within an integration. Registering a webhook must happen before verifying a webhook.
      operationId: register-webhook
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                webhook:
                  properties:
                    url:
                      type: string
                      description: The URL where Hover will POST webhook events.
                      default: https://webhook-receiver.com
                    content_type:
                      type: string
                      description: Optional and defaults to `x-www-form-urlencoded`. When it's given a valid value, webhook will include specified content type in POST header. Currently supports `x-www-form-urlencoded` and `json`
                      default: json
                  required: []
                  type: object
          multipart/form-data:
            schema:
              type: object
              properties:
                webhook:
                  properties:
                    url:
                      type: string
                      description: The URL where Hover will POST webhook events.
                      default: https://webhook-receiver.com
                    content_type:
                      type: string
                      description: Optional and defaults to `x-www-form-urlencoded`. When it's given a valid value, webhook will include specified content type in POST header. Currently supports `x-www-form-urlencoded` and `json`
                      default: json
                  required: []
                  type: object
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties:
                  id:
                    type: string
                  owner_type:
                    type: string
                  owner_id:
                    type: string
                  url:
                    type: string
                  created_at:
                    type: string
                  updated_at:
                    type: string
                  verified_at:
                    type: string
                  hmac_secret:
                    type: string
                  last_error:
                    type: string
                  content_type:
                    type: string
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '422':
          content:
            application/json:
              schema:
                type: object
                properties: {}
              examples:
                Unprocessable Entity:
                  summary: Unprocessable Entity
                  value: '{}'
          description: Unprocessable Entity
      tags:
      - Webhooks
  /api/v2/webhooks/{webhook_id}:
    delete:
      summary: Delete Webhook
      description: ''
      operationId: delete-webhook
      parameters:
      - name: webhook_id
        in: path
        description: The ID of the webhook you wish to delete.
        schema:
          type: integer
          format: int32
          default: 8675309
        required: true
      deprecated: false
      tags:
      - Webhooks
  /api/v2/webhooks/{webhook_id}/request_verification:
    post:
      summary: Resend Webhook Verification Code
      description: ''
      operationId: resend-webhook-verification-code
      parameters:
      - name: webhook_id
        in: path
        description: The ID of the webhook you want to verify.
        schema:
          type: integer
          format: int32
          default: 8675309
        required: true
      deprecated: false
      tags:
      - Webhooks
  /api/v2/webhooks/{webhook_verification_code}/verify:
    put:
      summary: Verify Webhook
      description: ''
      operationId: verify-webhook
      parameters:
      - name: webhook_verification_code
        in: path
        description: The webhook verification code received by your registered webhook URL.
        schema:
          type: string
          default: addd2b9-5cd7-497f-9f32
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Webhooks
components:
  securitySchemes:
    sec0:
      type: oauth2
      flows: {}
