                      default: '8058675309'
                    location_city:
                      type: string
                      description: The city of the job's address.
                      default: Los Angeles
                    location_region:
                      type: string
                      description: The two character state value.
                      default: CA
                    location_postal_code:
                      type: integer
                      description: The postal code of the job's address
                      default: 90210
                      format: int32
                    external_identifier:
                      type: string
                      description: A unique identifier generated by the client.
