  /api/v1/estimates/{project_management_production_list_id}:
    get:
      description: 'Get the details of a specific estimate given its ID. '
      responses:
        '200':
          description: ''
      parameters:
      - in: path
        name: project_management_production_list_id
        schema:
          type: string
        required: true
        description: 'This is the name used for the ID of the specific Estimate. '
      operationId: get_api-v1-estimates-project-management-production-list-id
      summary: Show Estimate Details
  /api/v1/estimates/{project_management_production_list_id}/order_documents:
    post:
      responses:
        '200':
          description: ''
          content: {}
      parameters:
      - in: path
        name: project_management_production_list_id
        schema:
          type: integer
        required: true
        description: Estimate ID also known as the project_management_production_list_id.
      - in: query
        name: line_Item_Type
        schema:
          type: string
          default: MATERIAL
        description: MATERIAL or LABOR depending on what Order doc you want back
      - in: query
        name: show_list_item_notes
        schema:
          type: boolean
          default: 'true'
        description: Include list item notes (UI default)
      - in: query
        name: show_item_measurements
        schema:
          type: boolean
          default: 'true'
        description: Include measurements (UI default)
      - in: query
        name: show_item_cost_details
        schema:
          type: boolean
          default: 'false'
        description: Include item cost details. If the caller cannot view unit costs, this is forced to false and the document is still created
      - in: query
        name: show_total_cost
        schema:
          type: boolean
          default: 'false'
        description: Include total cost
      - in: query
        name: notes
        schema:
          type: string
        description: Free-text notes on the document
      - in: query
        name: purchase_order_number
        schema:
          type: string
        description: Purchase order number on the document
      - in: query
        name: list_Item_Ids
        schema:
          type: array
          items:
            type: string
        description: Limit to specific list item ids
      summary: Create Order Documents PDF or CSV
      description: Creates a new order document for an Estimate.
      operationId: post_api-v1-estimates-project-management-production-list-id-order-documents
  /api/v1/estimates/{project_management_production_list_id}/order_documents/{id}:
    get:
      responses:
        '200':
          description: ''
      parameters:
      - in: path
        name: project_management_production_list_id
        schema:
          type: string
        required: true
        description: Estimate ID used at create time, also known as the project_management_production_list_id
      - in: path
        name: id
        schema:
          type: string
        required: true
        description: Order document ID from the create response
      summary: Show Order Documents PDF or CSV
      description: Poll the status and get back the order documents
      operationId: get_api-v1-estimates-project-management-production-list-id-order-documents-id
  /api/v1/instant_design/images:
    get:
      summary: List Instant Design Images
      description: ''
      operationId: list-instant-design-images
      parameters:
      - name: job_id
        in: query
        description: This or the lead_id is required. The ID of the Instant Design job.
        schema:
          type: integer
          format: int32
          default: 8675309
      - name: lead_id
        in: query
        description: This or Job ID is required. The ID of the Lead.
        schema:
          type: integer
          format: int32
          default: null
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"images\": [\n    {\n      \"id\": 1865953\n    },\n    {\n      \"id\": 1865937\n    },\n    {\n      \"id\": 1865940\n    },\n    {\n      \"id\": 1865942\n    },\n    {\n      \"id\": 1865990\n    },\n    {\n      \"id\": 1865945\n    },\n    {\n      \"id\": 1865991\n    }\n  ]\n}\n\n\n\n"
              schema:
                type: object
                properties:
                  images:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1865953
                          default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
  /api/v1/instant_design/images/{image_id}:
    get:
      summary: Show Instant Design Image
      description: ''
      operationId: show-instant-design-image
      parameters:
      - name: image_id
        in: path
        description: The ID of the Instant Design image.
        schema:
          type: integer
          format: int32
          default: 1842252
        required: true
      - name: job_id
        in: query
        description: Required. ID of the job associated with the Instant Design image
        schema:
          type: integer
          format: int32
          default: 8675309
      deprecated: false
  /api/v1/instant_design/leads:
    get:
      summary: List Instant Design Leads
      description: Use this endpoint to list all lead information submitted through the Instant Design lead form associated with the authenticated organization.
      operationId: list-instant-design-leads
      parameters:
      - name: org_id
        in: query
        description: Required. The ID of the organization the integration is authenticated with.
        schema:
          type: integer
          format: int32
          default: 8675309
      - name: per
        in: query
        description: Used for pagination. The number of leads to return in a payload. Default is 25.
        schema:
          type: integer
          format: int32
          default: 25
      - name: page
        in: query
        description: Used for pagination. The page number to return.
        schema:
          type: string
          default: '1'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
