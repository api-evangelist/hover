  /api/v1/instant_design/leads/{lead_id}:
    get:
      summary: Show Instant Design Lead Details
      description: Use this endpoint to retrieve detailed information for a single Instant Design lead given the lead ID
      operationId: show-instant-design-lead
      parameters:
      - in: path
        name: lead_id
        schema:
          type: string
        required: true
        description: Required. The ID of the lead you are requesting details for.
