aid: hover

name: HOVER

description: HOVER turns smartphone photos of a property into an accurate, interactive 3D model with complete exterior and interior measurements
  for the construction, roofing, insurance, and home-services industries. The HOVER API lets partners programmatically create and manage jobs,
  send capture requests that invite a homeowner or field technician to photograph a structure, receive real-time status updates via webhooks,
  and retrieve 3D models and measurement deliverables in JSON, PDF, XLSX, SKP, ESX, FML, and XML formats. Additional endpoints cover inspections,
  estimates and material lists, instant-design images and leads, blueprint reconstruction, job sharing, notes, users, wallets and payments. Authentication
  is OAuth 2.0 (authorization code + refresh), and a hosted MCP server exposes the same surface to AI agents. HOVER is backed by GV and Menlo
  Ventures.

